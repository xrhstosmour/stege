# Stege configuration.
#
# Read from ~/.config/stege/config.toml, falling back to ~/.stege-config.toml.
# The file is watched, so saving it applies immediately with no restart.

# system follows System Settings, or force it with light or dark.
theme = "system"

# Hides the bar entirely, leaving the real macOS menu bar and every
# third-party status item on it reachable. This file is watched, so
# flipping it takes effect immediately with no restart.
hidden = false

# A system-wide shortcut that hides and shows the bar, so you do not have to
# reach for the reveal chevron. Modifiers then a key, joined with "+". Leave it
# out to register nothing.
# toggle-shortcut = "cmd+alt+b"

[widgets]
# The bar, left to right. Remove an entry to hide that widget entirely.
# "spacer" pushes everything after it to the right, "divider" draws a separator.
displayed = [
    "default.applemenu",
    "default.spaces",
    "default.appmenus",
    "spacer",
    "default.reveal",
    "default.monitor",
    "default.privacy",
    "default.stayawake",
    "default.notifications",
    "default.audio",
    "default.keyboardlayout",
    "default.bluetooth",
    "default.network",
    "default.battery",
    "divider",
    "default.time",
]

# --- Left ------------------------------------------------------------------

[widgets.default.applemenu]
icon-size = 14
# The short menu, drawn in the bar's own style, with About This Mac,
# System Information, Log Out, Restart and Shut Down. Set to false to hand
# over to the full system menu instead, which also carries the duplicated
# option-key entries macOS gives no way to tell apart.
short-menu = true

[widgets.default.spaces]
space.show-key = true          # the workspace number or letter
window.show-title = true       # the focused window's title
window.title.max-length = 50
# Always show the app name rather than the window title for these.
window.title.always-display-app-name-for = ["Mail", "Chrome", "Arc"]

[widgets.default.appmenus]
max-menus = 6                  # Chrome exposes 11, which crowds a laptop bar
# Draws the application's own name menu, the first one, in bold, as macOS
# does. That menu is always shown either way, since it holds About and Quit.
show-application-name = true
# When the menus past the application's own name are drawn.
#   always   every menu, as macOS does
#   hover    only while the pointer is over them
#   modifier only while modifier-key is held
visibility = "always"
modifier-key = "option"     # option, command, control, shift, function

# --- Right -----------------------------------------------------------------

[widgets.default.reveal]
return-threshold = 80          # points the pointer must drop before the bar returns
timeout = 10                   # seconds before it returns regardless

[widgets.default.monitor]
show-network = false           # upload and download throughput
warning-level = 80             # percent at which the reading turns orange

[widgets.default.privacy]
# macOS only shows its own dot while a device is in use, which is the default
# here. Set always-show to keep both indicators visible, dimmed when idle.
always-show = false
style = "icon"                 # icon, or dot to match the system indicator

[widgets.default.stayawake]
# Only shows while something is holding the display awake, which is the
# default. Set always-show to keep the cup visible, dimmed when idle.
always-show = false

[widgets.default.notifications]
# The popup shows which Focus is on and opens Notification Center, which is
# where the notifications themselves stay. Stege does not draw the list:
# there is no public API for it, and the private database behind it needs
# Full Disk Access, which also grants read of Mail, Messages and browser
# data. Focus state comes from ~/Library/DoNotDisturb, which does not.
# Adds a second control opening Control Center beside the bell.
show-control-centre = false

[widgets.default.audio]
show-percentage = false        # the icon already conveys the level
# Badges the speaker with a small slash when the microphone is muted.
# The microphone is never a second icon in the bar.
show-microphone = true

[widgets.default.keyboardlayout]
show-full-name = false         # "Greek" rather than "EL"

[widgets.default.bluetooth]
hide-when-off = false

[widgets.default.network]
# Showing the name requires Location permission, which is only requested when
# this is on, or when the popup that displays it is opened.
show-name = false
hide-when-disconnected = false

[widgets.default.battery]
show-percentage = true
warning-level = 30
critical-level = 10

[widgets.default.time]
# A pattern containing J is treated as a locale template, where J means the
# locale decides 12 or 24 hour. Anything else is used literally.
format = "E d MMM  HH:mm"
# time-zone = "America/Los_Angeles"
calendar.format = "HH:mm"
calendar.show-events = true
# calendar.allow-list = ["Home", "Personal"]
# calendar.deny-list = ["Work"]

[widgets.default.time.popup]
view-variant = "box"

[widgets.default.nowplaying.popup]
view-variant = "horizontal"

# --- Appearance ------------------------------------------------------------

[experimental.background]
displayed = true
# 1 to 6 blur the desktop behind the bar. 7 is solid black, which makes the
# notch disappear into the bar on a notched display.
blur = 7
height = "menu-bar"            # menu-bar, default, or a number of points

[experimental.foreground]
height = "menu-bar"
horizontal-padding = 12
spacing = 10
