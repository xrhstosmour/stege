name: Build and test

# Pull requests only. A push to `main` is always a merged pull request that has
# already passed, and on a runner that only exists when the owner starts one, a
# push run would sit queued forever and be the first job the next runner took.
on:
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # The owner's Mac, through `bin/local-runner.sh --jobs 2`, which takes this
    # job and `Build`. Every hosted macOS pool, arm64 and Intel alike, left
    # jobs unassigned until GitHub cancelled them after 15 minutes, annotated
    # "Due to capacity constraints" (measured 2026-11-04). Nothing here may
    # install software or write outside the job directory, see `AGENTS.md`.
    runs-on: stege-local
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A SwiftPM package rather than an Xcode test target, so the suite runs
      # on a machine with only Command Line Tools. Its sources are symlinks
      # into Stege/Core, so there is one copy of each file and the application
      # and the tests cannot drift apart.
      - name: Run the tests
        working-directory: Tests
        run: swift test

  build:
    name: Build
    runs-on: stege-local
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Resolved separately so a dependency failure is distinguishable from a
      # compile failure. Into the job directory, not the user's `DerivedData`.
      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Stege.xcodeproj \
            -scheme Stege \
            -derivedDataPath .build

      # Signing is off here on purpose. This job answers "does it compile", and
      # nothing it produces is distributed. The release workflow is the only
      # place a signed artifact is built, with the same `ARCHS`.
      - name: Build
        run: |
          set -o pipefail
          # Used when the machine has it, never installed for this job.
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild build \
            -project Stege.xcodeproj \
            -scheme Stege \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            | "${formatter[@]}"

      - name: Confirm the app bundle was produced
        run: |
          app=".build/Build/Products/Release/Stege.app"
          test -d "$app" || { echo "missing $app"; exit 1; }
          test -x "$app/Contents/MacOS/Stege" || { echo "missing executable"; exit 1; }
          archs="$(lipo -archs "$app/Contents/MacOS/Stege")"
          test "$archs" = "arm64" || { echo "expected arm64, got $archs"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"

      # Archived with `ditto` before upload, not handed to the action directly.
      # `upload-artifact` rebuilds the tree file by file, losing the executable
      # bit and flattening the symlinks every `.app` depends on, so what came
      # back down would not launch.
      - name: Archive the app bundle
        run: |
          ditto -c -k --keepParent --sequesterRsrc \
            .build/Build/Products/Release/Stege.app Stege.zip

      # Lets the build be run on a machine with no Xcode installed. The bundle
      # is unsigned, since this job disables signing, so it needs an ad-hoc
      # signature locally before macOS will grant it Accessibility permission.
      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Stege-app
          path: Stege.zip
          retention-days: 7
          if-no-files-found: error
