name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Required to attach build provenance to the release artifact, so anyone can
  # verify the zip really came from this workflow and this commit.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    # The owner's Mac, through `bin/local-runner.sh --label stege-release`,
    # which `bin/release.sh` starts after pushing the tag. Its own label, so a
    # release runner never takes a queued pull request job instead. GitHub's hosted macOS pools left this job
    # unassigned until it was cancelled, annotated "Due to capacity
    # constraints", on arm64 and Intel alike (measured 2026-11-04). Still a
    # workflow, not a local script, because only an Actions job can attest the
    # archive's build provenance, which the tap's `Audit` job verifies.
    #
    # Everything below runs on a personal machine, so it must leave no trace:
    # no software installed, no keychain added to the search list, no trust
    # setting changed.
    runs-on: stege-release

    # Secrets are lifted into the job environment because the `secrets` context
    # is not available to step-level `if` conditions, only `env` is.
    env:
      SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
      SIGNING_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
      SIGNING_TEAM: ${{ secrets.DEVELOPER_ID_TEAM }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A certificate is optional. With one, the build is signed with it, and
      # macOS keeps the Accessibility grant across upgrades because the identity
      # does not change. Without one it falls back to an ad-hoc signature.
      #
      # The keychain lives in the job's temporary directory and is never added
      # to the user's search list, so it cannot change what any other app on
      # the machine finds. `codesign --keychain` reads it directly, see `Sign`.
      - name: Import signing certificate
        if: env.SIGNING_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        # The version reaches the script as a variable rather than being pasted
        # into it. A `${{ }}` expression is substituted into the shell source
        # before the shell ever sees it, so a tag name carrying a quote would be
        # executed rather than read, and the tag is the one part of this that is
        # typed by hand.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        #
        # Unsigned here and signed in its own step. Xcode looks for the identity
        # in the user's keychain search list, which this job leaves alone.
        run: |
          set -o pipefail
          # Used when the machine has it, never installed for this job.
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          xcodebuild build \
            -project Stege.xcodeproj \
            -scheme Stege \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | "${formatter[@]}"

      - name: Sign
        run: |
          app=".build/Build/Products/Release/Stege.app"
          test -d "$app" || { echo "missing $app"; exit 1; }
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -n "$SIGNING_IDENTITY" ]; then
            # By fingerprint, and only the committed certificate's. A different
            # certificate in the secret would change the signing identity and
            # silently drop every user's Accessibility grant on upgrade.
            fingerprint="$(openssl x509 -inform DER -in bin/stege-signing.cer \
              -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
            if ! security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" \
              | grep -q "$fingerprint"; then
              echo "error: no trusted signing identity matching bin/stege-signing.cer." \
                "Run bin/local-runner.sh in a terminal, it offers to trust it."
              exit 1
            fi
            identity=(--sign "$fingerprint" --keychain "$SIGNING_KEYCHAIN")
          else
            identity=(--sign -)
          fi
          codesign --force --options runtime --timestamp=none \
            --entitlements Stege/Stege.entitlements \
            "${identity[@]}" "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Authority|Signature)='

      - name: Package
        run: |
          app=".build/Build/Products/Release/Stege.app"
          test -d "$app" || { echo "missing $app"; exit 1; }
          archs="$(lipo -archs "$app/Contents/MacOS/Stege")"
          test "$archs" = "arm64" || { echo "expected arm64, got $archs"; exit 1; }
          # `ditto` is the only archiver that preserves the bundle's signature
          # and extended attributes, plain `zip` corrupts both.
          ditto -c -k --keepParent --sequesterRsrc "$app" Stege.zip

      - name: Notarize
        if: env.NOTARY_APPLE_ID != ''
        run: |
          xcrun notarytool submit Stege.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$SIGNING_TEAM" \
            --wait
          # The ticket staples onto the app itself, so repackage afterwards.
          ditto -x -k Stege.zip "$RUNNER_TEMP/stapled"
          xcrun stapler staple "$RUNNER_TEMP/stapled/Stege.app"
          rm Stege.zip
          ditto -c -k --keepParent --sequesterRsrc \
            "$RUNNER_TEMP/stapled/Stege.app" Stege.zip

      # Computed after notarization because stapling rewrites the bundle, and a
      # checksum taken before it would not match what users download.
      - name: Checksum
        id: checksum
        run: |
          checksum="$(shasum -a 256 Stege.zip | cut -d' ' -f1)"
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "Stege.zip sha256: $checksum"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Stege.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          Install with Homebrew:

          \`\`\`bash
          brew install --cask xrhstosmour/stege/stege
          \`\`\`

          \`Stege.zip\` \`sha256\`: \`${SHA256}\`

          Build provenance is attested. Verify the download really came from this
          workflow and this commit:

          \`\`\`bash
          gh attestation verify Stege.zip --repo ${{ github.repository }}
          \`\`\`
          EOF
          gh release create "$TAG" Stege.zip \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file notes.md

      # Opens a pull request against the tap rather than pushing to it directly,
      # so publishing a release can never silently change what `brew install`
      # resolves to without a human approving it.
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/homebrew-stege.git" tap
          cd tap
          sed -i '' -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/stege.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"${SHA256}\"/" Casks/stege.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${VERSION}"
          git checkout -b "$branch"
          git commit -am "Update \`stege\` to ${VERSION}"
          git push origin "$branch"
          gh pr create --fill --base main --head "$branch"

      # Always, so a failed build does not leave the private key on the machine.
      # `bin/local-runner.sh` deletes the job directory afterwards as well.
      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"
